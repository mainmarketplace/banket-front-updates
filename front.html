<title>Банкеты Любавы</title>
<style>
/* Визуал в стиле iikoFront: тёмно-серый фон, белые плоские плитки, жёлто-зелёное выделение */
:root{
  --bg:#3F4040; --bar:#2A2B2B; --head:#FFFFFF; --tile:#FFFFFF; --tile2:#F2F2F2;
  --ink:#1E1E1E; --ink-inv:#FFFFFF; --muted:#8B8B8B; --line:#C8C8C8; --dline:#565656;
  --sel:#E3E982; --sel-dk:#D6DE6A; --purple:#9C6BB3; --blue:#5C8FBC; --green:#33A98C;
  --teal:#2FA985; --red:#D9534F; --gray-tile:#6E7B84; --numpad-shade:#E4E4E4;
  --dark-tile:#4A4B4C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-inv);
  font:15px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
/* верхняя белая полоса */
.tophead{background:var(--head);color:var(--ink);min-height:56px;display:flex;align-items:center;gap:14px;padding:6px 16px;flex-wrap:wrap}
.tophead .t1{font-size:22px;font-weight:600}
.tophead .t2{font-size:13px;color:var(--muted)}
.tophead .spacer{flex:1}
.tinybar{background:#EDEDED;color:#555;font-size:11px;padding:2px 10px;display:flex;gap:14px}
.tinybar .r{margin-left:auto}
/* основная область */
.screen{flex:1;overflow:auto;padding:10px}
/* нижняя тёмная панель */
.botbar{background:var(--bar);display:flex;align-items:stretch;min-height:74px}
.botbar .bb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:8px 18px;color:#DDD;font-size:12px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;border:none;background:none;min-width:86px}
.botbar .bb:hover{background:#3A3B3B}
.botbar .bb .ic{font-size:22px;line-height:1}
.botbar .bb.right{margin-left:auto}
.botbar .bb.accent{color:#fff;font-weight:600}
.botbar .bb:disabled{opacity:.35;cursor:default}
/* плитки-кнопки */
.wtile{background:var(--tile);color:var(--ink);border:1px solid #B5B5B5;border-radius:2px;
  padding:14px;cursor:pointer;font:inherit;text-align:center}
.wtile:hover{background:var(--tile2)}
.wtile:disabled{color:#AAA;cursor:default;background:#E9E9E9}
.wtile.on{background:var(--sel)}
/* главный экран */
.home{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:1500px}
.hcol{display:flex;flex-direction:column;gap:10px}
.hsec .hhead{padding:12px;text-align:center;font-size:19px;font-weight:600;color:#fff}
.hsec .hbody{display:flex;flex-direction:column}
.hsec .hbody .wtile{border-radius:0;border-top:none;padding:22px 12px;font-size:16px}
.hsec .hbody .wtile:first-child{border-top:1px solid #B5B5B5}
.kassa-info{color:#fff;font-size:13px;padding:8px 12px;line-height:1.5}
.kassa-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#B5B5B5;border:1px solid #B5B5B5}
.kassa-grid .wtile{border:none;border-radius:0;padding:24px 10px;font-size:15px}
.usertile{color:#fff;padding:18px 12px;text-align:center}
.usertile .un{font-size:19px;font-weight:600;margin-bottom:10px}
/* список банкетов */
.listtop{display:flex;align-items:center;gap:6px;background:var(--bar);margin:-10px -10px 0;padding:6px 10px}
.listtop .icbtn{background:none;border:none;color:#eee;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;text-transform:uppercase;padding:6px 14px;cursor:pointer;border-radius:2px}
.listtop .icbtn .ic{font-size:24px}
.listtop .icbtn.on{background:var(--sel);color:var(--ink)}
.datenav{display:flex;align-items:center;gap:10px;margin:0 auto;color:#fff}
.datenav b{font-size:21px;font-weight:600}
.datenav small{display:block;text-align:center;color:#bbb}
.datenav .arr{background:none;border:none;color:#fff;font-size:28px;cursor:pointer;padding:0 12px}
.statchips{display:flex;background:#3A3B3B;margin:0 -10px;border-bottom:1px solid var(--dline)}
.statchips .sc{flex:1;text-align:center;padding:13px 6px;font-size:16px;color:#ccc;cursor:pointer;border:none;background:none}
.statchips .sc b{margin-left:6px}
.statchips .sc.on{background:var(--sel);color:var(--ink)}
.statchips .sc.dark{background:#2E2F2F}
table.ilist{border-collapse:collapse;width:100%;margin-top:0}
table.ilist th{background:#8A97A0;color:#fff;font-weight:400;font-size:14px;text-align:left;padding:9px 10px}
table.ilist td{background:var(--tile);color:var(--ink);padding:12px 10px;border-bottom:2px solid var(--bg);font-size:15px;vertical-align:middle}
table.ilist tr{cursor:pointer}
table.ilist tr:hover td{background:var(--tile2)}
td.stat-late{background:var(--red)!important;color:#fff;text-align:center;font-size:13px}
td.stat-ok{background:#8BC34A!important;color:#fff;text-align:center;font-size:13px}
td.stat-neu{text-align:center;font-size:13px;color:#666!important}
.cnt{text-align:center}
/* карточка банкета */
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1300px;margin:14px auto}
.fgroup{display:flex;flex-direction:column}
.fgroup .gt{color:#eee;text-align:center;font-size:17px;margin-bottom:10px}
.frow{display:grid;grid-template-columns:170px 1fr;border:1px solid #B5B5B5;border-top:none}
.frow:first-of-type{border-top:1px solid #B5B5B5}
.frow .fl{background:#E8E2DC;color:#333;padding:14px 12px;text-align:right;font-size:15px;display:flex;align-items:center;justify-content:flex-end}
.frow .fv{background:var(--tile)}
.frow .fv input,.frow .fv select{width:100%;height:100%;border:none;background:none;font:inherit;font-size:16px;color:var(--ink);padding:14px 12px;outline:none}
.frow .fv.req{background:#F6D7D7}
.frow .fv.req input{background:none}
.card-actions{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.card-actions .row2{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.card-actions .wtile{padding:20px 10px}
.card-actions .gray{background:#B9B9B9;color:#666}
/* экран заказа */
.order-wrap{display:grid;grid-template-columns:420px 1fr;gap:10px;height:100%}
.check{background:var(--tile);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.check .chead{background:#AEB8BF;color:#fff;padding:8px 12px;font-size:14px;display:flex;gap:16px;align-items:center}
.check .gtitle{background:var(--sel);padding:8px 12px;font-weight:600;text-align:center}
.check .items{flex:1;overflow:auto}
.check .ci{display:grid;grid-template-columns:44px 1fr 110px;align-items:center;padding:10px 8px;border-bottom:1px solid #E2E2E2;cursor:pointer;font-size:15px}
.check .ci.on{background:var(--sel)}
.check .ci .qty{color:#444}
.check .ci .sum{text-align:right;font-variant-numeric:tabular-nums}
.check .totals{border-top:2px solid #999}
.disc-panel{display:grid;grid-template-columns:150px 1fr;border-top:1px solid #ccc}
.disc-panel .dp1{padding:8px 10px;border-right:1px solid #ccc;cursor:pointer}
.disc-panel .dp1 small{display:block;color:#888;font-size:10px;text-transform:uppercase}
.disc-panel .dp1 b{font-size:17px}
.sumline{display:flex;justify-content:space-between;padding:5px 12px;font-size:13px;color:#666;text-transform:uppercase}
.bigsum{background:#fff;font-size:30px;font-weight:600;text-align:center;padding:8px;border-top:1px solid #ccc}
.check .tools{display:flex;border-top:1px solid #ccc}
.check .tools button{flex:1;background:none;border:none;border-right:1px solid #ddd;font-size:20px;color:#666;padding:10px;cursor:pointer}
/* меню справа */
.menu-side{display:flex;flex-direction:column;overflow:hidden;gap:8px}
.menu-nav{display:flex;gap:8px;align-items:center}
.menu-nav .nbtn{background:var(--dark-tile);border:none;color:#eee;font-size:20px;padding:12px 22px;cursor:pointer}
.menu-body{flex:1;display:grid;grid-template-columns:280px 1fr;gap:8px;overflow:hidden}
.cats{display:flex;flex-direction:column;gap:6px;overflow:auto}
.cats .cat{background:var(--gray-tile);border:none;color:#fff;padding:22px 12px;font-size:15px;cursor:pointer;text-align:center}
.cats .cat.on{background:#E8A33D;color:#402D05}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;align-content:start;overflow:auto}
.dishes .dish{background:var(--tile);border:1px solid #B5B5B5;color:var(--ink);min-height:86px;padding:8px;font-size:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;text-align:center}
.dishes .dish:hover{background:var(--tile2)}
.dishes .dish small{color:#777;margin-top:4px}
/* модальные окна в стиле iiko */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.imodal{background:#2E2F2F;box-shadow:0 8px 40px rgba(0,0,0,.6);min-width:480px;max-width:92vw;max-height:92vh;overflow:auto}
.imodal .mtitle{color:#fff;text-align:center;font-size:19px;padding:16px}
.imodal .msub{color:#ddd;text-align:center;padding:0 16px 10px;font-size:15px}
.imodal .mbtns{display:flex;justify-content:center;gap:60px;padding:16px;border-top:1px solid #444}
.imodal .mbtns button{background:none;border:none;color:#fff;font-size:19px;font-weight:600;cursor:pointer;padding:8px 20px}
.imodal .mbtns button.acc{color:var(--sel)}
/* нумпад */
.numwrap{background:#fff;margin:0 16px 4px;padding:0}
.numdisp{display:grid;grid-template-columns:1fr auto;background:#6B6B6B;color:#fff}
.numdisp .nd{font-size:34px;padding:8px 20px;text-align:right;font-variant-numeric:tabular-nums}
.numdisp .nu{background:#2E2F2F;font-size:22px;padding:14px 26px;display:flex;align-items:center}
.numgrid{display:grid;grid-template-columns:repeat(5,110px);grid-auto-rows:74px}
.numgrid button{background:#fff;border:1px solid #D5D5D5;font-size:26px;cursor:pointer;color:#222}
.numgrid button.shade{background:var(--numpad-shade);font-size:20px}
.numgrid button:active{background:var(--sel)}
/* предоплата */
.pp-tabs{display:flex;background:#fff}
.pp-tabs .pt{flex:1;text-align:center;padding:18px 10px;font-size:16px;font-weight:600;color:#333;cursor:pointer;border:none;background:#fff}
.pp-tabs .pt.on{background:var(--sel)}
.pp-sel{color:#ddd;text-align:center;padding:10px;font-size:14px}
.pp-sel b{color:var(--sel)}
.paylist{color:#eee;padding:4px 24px;font-size:15px}
.paylist .pl{display:flex;justify-content:space-between;background:#fff;color:#222;padding:10px 12px;margin:6px 0;align-items:center}
.paylist .pl .x{color:#B33;cursor:pointer;font-size:18px;border:none;background:none;padding:0 4px}
.mact{display:flex;gap:26px;justify-content:flex-end;padding:14px 22px;border-top:1px solid #444;align-items:center}
.mact button{background:none;border:none;color:#bbb;font-size:18px;cursor:pointer;padding:6px 10px}
.mact button.acc{color:#fff;font-weight:600}
.mact button:disabled{color:#666;cursor:default}
.paymeth{display:flex;flex-direction:column;gap:2px;padding:10px 24px}
.paymeth button{background:#fff;border:none;padding:18px;font-size:17px;cursor:pointer}
/* оплата заказа */
.pay-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}
.pay-left{background:var(--tile);color:var(--ink);overflow:auto}
.pay-left .ph{padding:10px 14px;font-weight:600;font-size:18px;border-bottom:1px solid #ddd}
.pay-left .itot{display:flex;justify-content:space-between;padding:8px 14px;font-size:15px;border-bottom:1px solid #eee}
.pay-left .itot.big{font-size:19px;font-weight:600}
.pay-right{display:flex;flex-direction:column;gap:8px;overflow:auto}
.pr-due{display:flex;justify-content:space-between;color:#fff;font-size:22px;padding:10px 16px;background:#333}
.methrow{display:flex;gap:2px}
.methrow .mt{flex:1;background:#6E7B84;border:none;color:#fff;padding:14px 8px;font-size:13px;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.methrow .mt .ic{font-size:22px}
.methrow .mt:hover{background:#7E8B94}
.paybtn{background:var(--sel);border:none;font-size:22px;font-weight:600;padding:20px;cursor:pointer;margin-top:auto}
.paybtn:disabled{background:#777;color:#aaa;cursor:default}
/* закрытые заказы: даты */
.daytabs{display:flex;background:#3A3B3B;margin:0 -10px;border-bottom:1px solid var(--dline)}
.daytabs .dt{flex:1;text-align:center;padding:14px 4px;color:#ccc;cursor:pointer;border:none;background:none;font-size:15px}
.daytabs .dt.on{background:#6E7B84;color:#fff}
.daytabs .dt small{display:block;color:#aaa;font-size:11px}
/* настройки/меню (служебные, стиль сохранён) */
.setwrap{max-width:1100px;margin:0 auto;color:#eee}
.setwrap h3{font-size:16px;text-transform:uppercase;color:#ccc;margin:18px 0 8px}
.setwrap table{border-collapse:collapse;width:100%}
.setwrap td,.setwrap th{background:#fff;color:#222;padding:6px 8px;border-bottom:2px solid var(--bg);font-size:14px}
.setwrap th{background:#8A97A0;color:#fff;font-weight:400}
.setwrap input,.setwrap select{width:100%;border:1px solid #ccc;font:inherit;padding:6px}
.setwrap .muted{color:#aaa;font-size:13px}
.lockbtn{background:none;border:2px solid #444;border-radius:4px;color:#333;font-size:20px;padding:4px 10px;cursor:pointer}
@media(max-width:900px){.order-wrap{grid-template-columns:1fr}.pay-wrap{grid-template-columns:1fr}.home{grid-template-columns:repeat(2,1fr)}.card-grid{grid-template-columns:1fr}}
#printArea{display:none}
@media print{
  body{background:#fff;overflow:visible}
  #app{display:none}
  #printArea{display:block;font:13px/1.5 Georgia,serif;color:#000;padding:10mm}
  #printArea h1{font-size:20px;margin:0 0 2px}
  #printArea table{width:100%;border-collapse:collapse;margin-top:10px}
  #printArea th,#printArea td{border-bottom:1px solid #999;padding:5px 6px;text-align:left;color:#000}
  #printArea .num{text-align:right}
  #printArea .tot{font-weight:700}
}
</style>

<div id="app">
  <div class="tinybar"><span>Банкеты Любавы</span><span id="clock"></span><span class="r" id="userlbl"></span></div>
  <div id="banner"></div>
  <div class="screen" id="screen"></div>
  <div class="botbar" id="botbar"></div>
</div>
<div id="modal"></div>
<div id="printArea"></div>

<script>
"use strict";
/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const uid=()=> (crypto.randomUUID?crypto.randomUUID():('id'+Date.now()+Math.random().toString(16).slice(2)));
const fmt=n=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0)+' р.';
const fmt0=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n||0)+' р.';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ruDate=iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return d+'.'+m+'.'+y;};
const ruDT=iso=>{if(!iso)return '';const d=new Date(iso);return ruDate(isoOf(d))+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const num=v=>{const n=parseFloat(String(v).replace(',','.').replace(/\s/g,''));return isNaN(n)?0:n;};
const MONTHS_R=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
/* способы оплаты как в iikoFront */
const METHODS={
  qr:{name:'QR код',group:'Банковские карты'},
  otkr:{name:'Открытие',group:'Банковские карты'},
  sber:{name:'Сбербанк',group:'Банковские карты'},
  acq:{name:'Эквайринг',group:'Банковские карты'},
  cash:{name:'Наличные',group:'Оплата наличными'},
  account:{name:'Безналичный расчет',group:'Безналичный расчет'}
};
const mName=k=>(METHODS[k]||{name:k}).name;
const mGroup=k=>(METHODS[k]||{group:''}).group;
setInterval(()=>{const d=new Date();const c=$('#clock');if(c)c.textContent=ruDate(todayISO())+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');},1000);

/* ================= db-адаптер ================= */
let db=null;
function unwrapDoc(s){if(s==null)return null;if(typeof s.data==='function'){try{return s.data()||null;}catch(e){return null;}}
  if(s.data!==undefined&&typeof s.data==='object')return s.data;if(s.exists===false)return null;return typeof s==='object'?s:null;}
function unwrapCol(s){if(!s)return[];let a=Array.isArray(s)?s:(s.docs||s.documents||[]);
  return a.map(d=>{const x=unwrapDoc(d);return x?{id:d.id||x.id,data:x}:null;}).filter(Boolean);}
async function dbGetDoc(p){if(!db)return null;try{return unwrapDoc(await db.doc(p).get());}catch(e){return null;}}
async function dbSetDoc(p,d){if(!db)return false;try{await db.doc(p).set(d);return true;}catch(e){alert('Не удалось сохранить. Проверьте связь.');return false;}}
async function dbGetCol(p){if(!db)return[];try{return unwrapCol(await db.collection(p).get());}catch(e){return[];}}

/* ================= состояние ================= */
const S={
  screen:'home', rms:[],fronts:[],conceptions:[],stores:[],menus:{},banquets:[],shifts:[],
  listDate:todayISO(), listFilter:'act', closedDate:todayISO(),
  editingId:null, cat:null, selItem:null, frontId:null,
  employees:[], user:null
};
/* мгновенная выгрузка события в iiko (оплата, закрытие смены) — работает при запуске через свой сервер */
function pushIiko(kind,extra){
  try{fetch('/api/push',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({kind:kind},extra||{}))}).catch(()=>{});}catch(e){}
}
const pinRequired=()=>S.employees.some(e=>e.pin);
try{S.frontId=localStorage.getItem('bq_front')||null;}catch(e){}
const frontById=id=>S.fronts.find(f=>f.id===id);
const rmsById=id=>S.rms.find(r=>r.id===id);
const curFront=()=>frontById(S.frontId)||S.fronts[0]||null;
function bqFront(b){return frontById(b.frontId)||null;}
function bqRms(b){const f=bqFront(b);return f?rmsById(f.rmsId):null;}
function openShiftFor(fid){return S.shifts.find(x=>x.data.frontId===fid&&!x.data.closedAt);}
function shiftNum(fid){return S.shifts.filter(x=>x.data.frontId===fid).length;}

/* ================= загрузка ================= */
(async function boot(){
  render();
  try{db=await claude.use('db');}catch(e){db=null;}
  if(!db){$('#banner').innerHTML='<div style="background:#7a5a1e;color:#ffd;padding:8px 14px;font-size:14px">Нет соединения с базой — откройте страницу через сервер или приложение Claude.</div>';return;}
  const st=await dbGetDoc('config/structure')||{};
  S.rms=st.rms||[];S.fronts=st.fronts||[];S.conceptions=st.conceptions||[];S.stores=st.stores||[];
  const emp=await dbGetDoc('config/employees')||{};
  S.employees=(emp.items||[]).filter(e=>e&&e.name);
  S.banquets=await dbGetCol('banquets');
  S.shifts=await dbGetCol('shifts');
  if(!S.frontId&&S.fronts.length)S.frontId=S.fronts[0].id;
  render();
  try{
    db.collection('banquets').onSnapshot(s=>{S.banquets=unwrapCol(s);if(['list','closed','home'].includes(S.screen))render();});
    db.collection('shifts').onSnapshot(s=>{S.shifts=unwrapCol(s);if(['home'].includes(S.screen))render();});
  }catch(e){setInterval(async()=>{S.banquets=await dbGetCol('banquets');S.shifts=await dbGetCol('shifts');if(['list','closed','home'].includes(S.screen))render();},15000);}
})();
async function loadMenu(rmsId){if(!S.menus[rmsId])S.menus[rmsId]=(await dbGetDoc('menus/'+rmsId))||{items:[]};return S.menus[rmsId];}
function saveStructure(){dbSetDoc('config/structure',{rms:S.rms,fronts:S.fronts,conceptions:S.conceptions,stores:S.stores});}

/* ================= расчёты ================= */
function bqTotals(b){
  const sub=(b.items||[]).reduce((s,i)=>s+num(i.price)*num(i.qty),0);
  const service=sub*num(b.servicePct)/100;
  const discount=sub*num(b.discountPct)/100+num(b.discountRub);
  const total=Math.max(0,Math.round((sub+service-discount)*100)/100);
  const paid=(b.payments||[]).reduce((s,p)=>s+num(p.amount),0);
  return {sub,service,discount,total,paid,rest:Math.round((total-paid)*100)/100};
}

  const disp=()=>{$('#np_v').textContent=val||'0';};disp();

/* ================= СПИСОК БАНКЕТОВ ================= */
function bqState(b){
  if(b.status==='closed')return 'done';
  if(b.status==='cancelled')return 'off';
  const now=new Date();
  const dt=new Date(b.date+'T'+(b.time||'23:59'));
  if(b.started)return 'started';
  if(b.date<=todayISO()&&dt<now)return 'late';
  return 'act';
}
function lateText(b){
  const dt=new Date(b.date+'T'+(b.time||'00:00'));const mins=Math.floor((Date.now()-dt)/60000);
  const h=Math.floor(mins/60),m=mins%60;
  return 'Опаздывают на '+(h?h+' ч. ':'')+m+' мин.!';
}

  scr.innerHTML=`
  <div class="order-wrap">

      <div class="totals">

            <div class="bigsum" id="t_due"></div>

          <button id="tl_plus" title="Добавить">＋</button>
          <button id="tl_minus" title="Удалить позицию">－</button>
          <button id="tl_123" title="Количество">123</button>
          <button id="tl_del" title="Удалить">✕</button>
        </div>
      </div>
    </div>
    <div class="menu-side">
      <div class="menu-nav">
        <button class="nbtn" id="mn_back">←</button>
        <button class="nbtn" id="mn_home">⌂</button>
        <div style="color:#ccc;font-size:14px;margin-left:auto">${esc(rms?rms.name:'')} · меню из iiko</div>
      </div>
      <div class="menu-body">
        <div class="cats">${cats.map(c=>`<button class="cat ${c===S.cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
        <div class="dishes" id="dishes"></div>
      </div>
    </div>
  </div>`;
  function refreshCheck(){
    const t2=bqTotals(b);
    $('#d_pct').textContent=(b.discountPct||0)+'%'+(b.discountRub?(' +'+fmt0(b.discountRub)):'');
    $('#d_srv').textContent=(b.servicePct||0)+'%';
    $('#t_sub').textContent=fmt(t2.total);
    $('#t_paid').textContent=fmt(t2.paid);
    $('#t_due').textContent=fmt(Math.max(0,t2.rest));
    const list=$('#ci_list');
    list.innerHTML=b.items.length?b.items.map(i=>`<div class="ci ${S.selItem===i.id?'on':''}" data-i="${i.id}">
      <span class="qty">${esc(i.qty)}</span><span>${esc(i.name)}</span><span class="sum">${fmt(num(i.price)*num(i.qty))}</span></div>`).join('')
      :'<div style="color:#999;text-align:center;padding:30px">Выберите блюда из меню справа</div>';
    list.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{S.selItem=el.dataset.i;refreshCheck();});
  }
  refreshCheck();
  const drawDishes=()=>{
    const its=menu.items.filter(i=>(i.category||'Прочее')===S.cat);
    const de=$('#dishes');
    de.innerHTML=its.map(i=>`<button class="dish" data-d="${i.id}" ${locked?'disabled':''}>${esc(i.name)}<small>${i.freePrice||!num(i.price)?'свободная цена':fmt0(i.price)}</small></button>`).join('');
    de.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{
      const it=menu.items.find(i=>i.id===el.dataset.d);
      const addIt=(price)=>{
        const ex=b.items.find(x=>x.name===it.name&&num(x.price)===num(price));
        if(ex){ex.qty=num(ex.qty)+1;S.selItem=ex.id;}else{const ni={id:uid(),name:it.name,price:price,qty:1,productId:it.productId||null};b.items.push(ni);S.selItem=ni.id;}
        saveBq(b);refreshCheck();

      if(it.freePrice||!num(it.price)){ // свободная цена — как в iikoFront, спросить цену

  scr.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{S.cat=el.dataset.c;
    scr.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x===el));drawDishes();});
  $('#mn_back').onclick=()=>go('card');
  $('#mn_home').onclick=()=>go('home');
  const sel=()=>b.items.find(i=>i.id===S.selItem);
  $('#tl_plus').onclick=()=>{const i=sel();if(i&&!locked){i.qty=num(i.qty)+1;saveBq(b);refreshCheck();}};
  $('#tl_minus').onclick=()=>{const i=sel();if(i&&!locked){i.qty=Math.max(0,num(i.qty)-1);if(!i.qty)b.items=b.items.filter(x=>x.id!==i.id);saveBq(b);refreshCheck();}};
  $('#tl_123').onclick=()=>{const i=sel();if(i&&!locked)numpad({t:'КОЛИЧЕСТВО',sub:i.name},i.qty,'порц',v=>{i.qty=v||1;saveBq(b);refreshCheck();});};
  $('#tl_del').onclick=()=>{const i=sel();if(i&&!locked)iConfirm('Удалить позицию «'+i.name+'»?',()=>{b.items=b.items.filter(x=>x.id!==i.id);saveBq(b);refreshCheck();});};
  $('#d_open').onclick=()=>{if(!locked)discountModal(b,refreshCheck);};
  botbar(bar,[{a:'back',t:'Назад',ic:'‹'},{a:'bq',t:'Банкет',ic:'🍽'},{a:'kassa',t:'Касса',ic:'🖩',cls:'accent'},
    {a:'prepay',t:'Предоплата',ic:'💰',cls:'accent'},{a:'precheck',t:'Пречек',ic:'🧾',cls:'right'},{a:'print',t:'Печать',ic:'🖨'}]);
  bar._acts={back:()=>go('card'),bq:()=>go('card'),kassa:()=>go('pay'),
    prepay:()=>prepayModal(b,()=>{refreshCheck();}),precheck:()=>printBq(b,'client'),print:()=>printMenuModal(b)};
}
/* скидки как в iiko */
function discountModal(b,after){
  const t=bqTotals(b);
  const mk=(p)=>`<button class="wtile" data-p="${p}" style="padding:26px 8px">От суммы чека ${p}% скидка (-${p}%)<br><br><b>-${fmt(t.sub*p/100)}</b></button>`;
  modal(`<div class="imodal" style="min-width:820px"><div class="mtitle" style="display:flex;justify-content:space-between;padding:16px 26px">
    <span>Подытог&nbsp;&nbsp;<b>${fmt(t.sub)}</b></span><span style="background:var(--sel);color:#222;padding:4px 16px">Скидки</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 20px">
      ${[5,10,15,20,30,50].map(mk).join('')}
      <button class="wtile" id="d_free" style="padding:26px 8px">Свободная скидка, %</button>
      <button class="wtile" id="d_rub" style="padding:26px 8px">Скидка суммой, р.</button>
      <button class="wtile" id="d_srv" style="padding:26px 8px">Надбавка за обслуживание, %<br><br><b>${b.servicePct||0}%</b></button>
    </div>
    <div class="mbtns"><button id="d_clear">Удалить</button><button class="acc" id="m_ok">ОК</button></div></div>`);
  const done=()=>{saveBq(b);closeModal();after&&after();};
  $('#modal').querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{b.discountPct=num(x.dataset.p);b.discountRub=0;done();});
  $('#d_free').onclick=()=>numpad({t:'СВОБОДНАЯ СКИДКА'},b.discountPct||'', '%',v=>{b.discountPct=v;saveBq(b);after&&after();});
  $('#d_rub').onclick=()=>moneyPad('СКИДКА СУММОЙ',v=>{b.discountRub=v;saveBq(b);after&&after();});
  $('#d_srv').onclick=()=>numpad({t:'НАДБАВКА ЗА ОБСЛУЖИВАНИЕ'},b.servicePct||'', '%',v=>{b.servicePct=v;saveBq(b);after&&after();});
  $('#d_clear').onclick=()=>{b.discountPct=0;b.discountRub=0;done();};
  $('#m_ok').onclick=done;
}
/* предоплата как в iiko: вкладки групп, подтипы карт, нумпад с +N */
function prepayModal(b,after){
  const f=bqFront(b);
  const sh=f?openShiftFor(f.id):null;
  if(!sh){iConfirm('Кассовая смена фронта «'+((f||{}).name||'')+'» не открыта. Вносить деньги можно только при открытой смене. Открыть её можно на главном экране в разделе КАССА.',null,'Понятно','Закрыть');return;}
  let group='Оплата наличными', method='cash', val='';
  const draw=()=>{
    const t=bqTotals(b);
    modal(`<div class="imodal" style="min-width:900px"><div class="mtitle">ПРЕДОПЛАТА</div>
    <div class="pp-tabs">
      ${['Безналичный расчет','Банковские карты','Оплата наличными'].map(g=>`<button class="pt ${g===group?'on':''}" data-g="${g}">${g.toUpperCase()}</button>`).join('')}
    </div>
    <div class="pp-sel">ВЫБРАННЫЙ ТИП: <b>${mName(method)}</b></div>
    <div class="paylist">
      Внесено ранее: ${fmt(t.paid)} · Остаток: ${fmt(Math.max(0,t.rest))}
      ${(b.payments||[]).map(p=>`<div class="pl"><span>${mName(p.method)} · ${ruDate(p.date)}</span><span>${fmt(p.amount)}
        ${b.status==='closed'?'':`<button class="x" data-delp="${p.id}">✕</button>`}</span></div>`).join('')}
    </div>
    <div class="numwrap"><div class="numdisp"><div class="nd" id="pp_v">${val||'0,00 р.'}</div></div>
    <div class="numgrid" style="grid-template-columns:repeat(5,130px)">
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button><button class="shade" data-d="+1">+1</button><button class="shade" data-d="+5">+5</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button><button class="shade" data-d="+10">+10</button><button class="shade" data-d="+50">+50</button>
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button><button class="shade" data-d="+100">+100</button><button class="shade" data-d="+500">+500</button>
      <button data-d=",">,</button><button data-d="0">0</button><button data-d="X">✕</button><button class="shade" data-d="+1000">+1000</button><button class="shade" data-d="+5000">+5000</button>
    </div></div>
    <div class="mact"><button id="pp_rest">Остаток (${fmt0(Math.max(0,t.rest))})</button>
      <button class="acc" id="pp_add" ${b.status==='closed'?'disabled':''}>Внести предоплату</button><button id="pp_close">Закрыть</button></div></div>`);
    $('#modal').querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{
      group=x.dataset.g;
      if(group==='Оплата наличными'){method='cash';draw();}
      else if(group==='Безналичный расчет'){method='account';draw();}
      else{ // выбор способа как в iiko
        modal(`<div class="imodal"><div class="mtitle">ВЫБОР СПОСОБА ОПЛАТЫ</div>
        <div class="paymeth">${['qr','otkr','sber','acq'].map(k=>`<button data-m="${k}">${mName(k)}</button>`).join('')}</div>
        <div class="mbtns"><button id="m_no">Отмена</button></div></div>`);
        $('#modal').querySelectorAll('[data-m]').forEach(y=>y.onclick=()=>{method=y.dataset.m;group='Банковские карты';draw();});
        $('#m_no').onclick=()=>{draw();};
      }
    });
    $('#modal').querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{
      const d=x.dataset.d;
      if(d==='X')val='';else if(d.startsWith('+'))val=String(num(val)+num(d.slice(1)));
      else val=(val==='0'?'':val)+d;
      $('#pp_v').textContent=val?val+' р.':'0,00 р.';
    });
    $('#pp_rest').onclick=()=>{val=String(Math.max(0,bqTotals(b).rest)).replace('.',',');$('#pp_v').textContent=val+' р.';};
    $('#pp_add').onclick=()=>{
      const amount=num(val);
      if(amount<=0){return;}
      b.payments.push({id:uid(),date:todayISO(),method,amount,ts:new Date().toISOString(),shiftId:sh.id,by:S.user?S.user.name:''});
      saveBq(b,true);pushIiko('pko');val='';draw();after&&after();
    };
    $('#pp_close').onclick=()=>{closeModal();after&&after();};
    $('#modal').querySelectorAll('[data-delp]').forEach(x=>x.onclick=()=>{
      iConfirm('Удалить предоплату?',()=>{b.payments=b.payments.filter(p=>p.id!==x.dataset.delp);saveBq(b,true);draw();after&&after();});
    });
  };
  draw();
}
function printMenuModal(b){

    <div class="paymeth"><button id="pr_c">Счёт для клиента</button><button id="pr_k">Заказ для кухни</button></div>
    <div class="mbtns"><button id="m_no">Отмена</button></div></div>`);

}

  const f=bqFront(b);
  const sh=f?openShiftFor(f.id):null;
  scr.innerHTML=`
  <div class="tophead" style="margin:-10px -10px 10px">
    <div class="t1">ОПЛАТА ЗАКАЗА #${esc(b.num||'')}</div>
    <div class="t2">Банкет: ${ruDate(b.date)} ${esc(b.time||'')} · ${esc((f||{}).name||'')}</div>
    <div class="spacer"></div>
    ${sh?`<div class="t2">Смена №${sh.data.num}</div>`:`<div class="t2" style="color:#C33">Кассовая смена не открыта!</div>`}
  </div>
  <div class="pay-wrap">
    <div class="pay-left">
      <div class="ph">Гость 1</div>
      ${b.items.map(i=>`<div class="itot"><span>${esc(i.qty)} × ${esc(i.name)}</span><span>${fmt(num(i.price)*num(i.qty))}</span></div>`).join('')}
      <div class="itot"><span>ПОДЫТОГ:</span><span>${fmt(t.sub)}</span></div>
      ${t.discount?`<div class="itot"><span>СКИДКА:</span><span>-${fmt(t.discount)}</span></div>`:''}
      ${t.service?`<div class="itot"><span>НАДБАВКА ${b.servicePct}%:</span><span>+${fmt(t.service)}</span></div>`:''}
      <div class="itot"><span>ПРЕДОПЛАТА:</span><span>${fmt(t.paid)}</span></div>
      <div class="itot big"><span>ИТОГО:</span><span>${fmt(t.total)}</span></div>
    </div>
    <div class="pay-right">
      <div class="pr-due"><span>К ОПЛАТЕ:</span><b>${fmt(Math.max(0,t.rest))}</b></div>
      ${(b.payments||[]).map(p=>`<div class="paylist"><div class="pl"><span>ПРЕДОПЛАТА: ${mName(p.method).toUpperCase()}</span><b>${fmt(p.amount)}</b></div></div>`).join('')}
      <div class="methrow">
        <button class="mt" id="pm_cash"><span class="ic">💵</span>Наличные</button>
        <button class="mt" id="pm_card"><span class="ic">💳</span>Банковские карты</button>

    </div>
  </div>`;
  const addPay=(method)=>{
    if(!sh){iConfirm('Кассовая смена не открыта. Вносить деньги можно только при открытой смене.',null,'Понятно','Закрыть');return;}
    if(b.status!=='active')return;
    const doAdd=(m)=>moneyPad('ВНЕСТИ: '+mName(m),v=>{
      if(v<=0)return;
      b.payments.push({id:uid(),date:todayISO(),method:m,amount:v,ts:new Date().toISOString(),shiftId:sh.id,by:S.user?S.user.name:''});
      saveBq(b,true);pushIiko('pko');render();
    });
    if(method==='card'){
      modal(`<div class="imodal"><div class="mtitle">ВЫБОР СПОСОБА ОПЛАТЫ</div>
      <div class="paymeth">${['qr','otkr','sber','acq'].map(k=>`<button data-m="${k}">${mName(k)}</button>`).join('')}</div>
      <div class="mbtns"><button id="m_no">Отмена</button></div></div>`);
      $('#modal').querySelectorAll('[data-m]').forEach(y=>y.onclick=()=>{closeModal();doAdd(y.dataset.m);});
      $('#m_no').onclick=closeModal;
    }else doAdd(method==='cash'?'cash':'account');
  };
  $('#pm_cash').onclick=()=>addPay('cash');
  $('#pm_card').onclick=()=>addPay('card');
  $('#pm_acc').onclick=()=>addPay('account');
  $('#paybtn').onclick=()=>{
    iConfirm('Закрыть банкет? Он будет проведён, акт реализации создастся в iiko автоматически в 23:00.',()=>{
      b.status='closed';b.closedAt=new Date().toISOString();b.iikoStatus='pending';b.shiftId=sh.id;
      saveBq(b,true);go('list');
    });
  };
  botbar(bar,[{a:'back',t:'Назад',ic:'‹'},{a:'order',t:'Заказ',ic:'🍽'},{a:'prepay',t:'Предоплата',ic:'💰'},
    {a:'check',t:'С товарным чеком',ic:'🧾',cls:'right'}]);
  bar._acts={back:()=>go('order'),order:()=>go('order'),prepay:()=>prepayModal(b,()=>render()),check:()=>printBq(b,'client')};
}

/* ================= ЗАКРЫТЫЕ ЗАКАЗЫ ================= */
function renderClosed(scr,bar){
  const days=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(isoOf(d));}
  if(!days.includes(S.closedDate))S.closedDate=days[0];
  const rows=S.banquets.filter(x=>x.data.status==='closed'&&(x.data.closedAt||'').slice(0,10)===S.closedDate)
    .sort((a,b)=>(b.data.closedAt||'').localeCompare(a.data.closedAt||''));
  scr.innerHTML=`
  <div class="tophead" style="margin:-10px -10px 0"><div class="t1">Закрытые заказы</div>
    <div class="spacer"></div><div class="t2">${rows.length} шт.</div></div>
  <div class="daytabs">${days.map(d=>{const dd=new Date(d+'T00:00:00');
    return `<button class="dt ${d===S.closedDate?'on':''}" data-d="${d}">${dd.getDate()} ${MONTHS_R[dd.getMonth()]}${d===todayISO()?'<small>Сегодня</small>':''}</button>`;}).join('')}</div>
  <table class="ilist"><thead><tr><th style="width:70px">№</th><th>Размещение</th><th>Кассовая смена</th><th>Время</th>
    <th style="width:130px">Сумма</th><th>Состав</th><th>Оплаты</th><th>Акт iiko</th></tr></thead>
  <tbody>${rows.length?rows.map(x=>{const b=x.data,t=bqTotals(b);
    const sh=S.shifts.find(s=>s.id===b.shiftId);
    const pays=Object.entries((b.payments||[]).reduce((m,p)=>{m[p.method]=(m[p.method]||0)+num(p.amount);return m;},{}))
      .map(([k,s])=>mName(k)+': '+fmt0(s)).join('<br>');
    return `<tr data-o="${x.id}"><td class="cnt">${esc(b.num||'')}</td>
    <td>${esc((bqFront(b)||{}).name||'')}${b.tableNum?': '+esc(b.tableNum):''}</td>
    <td class="cnt">${sh?sh.data.num+(sh.data.closedAt?'<br><small style="color:#888">Закрыта</small>':'<br><small style="color:#2A7">Открыта</small>'):'—'}</td>
    <td class="cnt">${b.closedAt?ruDT(b.closedAt).split(' ')[1]:''}<br><small style="color:#888">${ruDate(b.date)}</small></td>
    <td style="text-align:right"><b>${fmt(t.total)}</b></td>
    <td style="font-size:13px">${b.items.slice(0,3).map(i=>esc(i.name)+' × '+esc(i.qty)).join(';<br>')}${b.items.length>3?'; …':''}</td>
    <td style="font-size:13px">${pays||'—'}</td>
    <td class="cnt">${b.iikoStatus==='uploaded'?'<span style="color:#2A7">создан</span>':'<span style="color:#C80">в очереди</span>'}</td></tr>`;}).join('')
    :`<tr><td colspan="8" style="text-align:center;color:#999;padding:30px">За эту дату закрытых заказов нет</td></tr>`}</tbody></table>`;
  scr.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{S.closedDate=x.dataset.d;render();});
  scr.querySelectorAll('[data-o]').forEach(r=>r.onclick=()=>{S.editingId=r.dataset.o;go('card');});
  botbar(bar,[{a:'back',t:'Назад',ic:'‹'}]);
  bar._acts={back:()=>go('home')};
}

/* ================= ПЕЧАТЬ ================= */
function printBq(b,mode){
  const t=bqTotals(b);
  const rows=b.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="num">${esc(i.qty)}</td>${mode==='client'?`<td class="num">${fmt0(i.price)}</td><td class="num">${fmt0(num(i.price)*num(i.qty))}</td>`:''}</tr>`).join('');
  $('#printArea').innerHTML=`
    <h1>${mode==='client'?'Банкетное меню / счёт':'Банкет — для кухни'}</h1>
    <div>Кафе «Любава» · ${esc((bqRms(b)||{}).name||'')} / ${esc((bqFront(b)||{}).name||'')}</div>
    <div>Банкет № ${esc(b.num||'')} · <b>${ruDate(b.date)}${b.time?' '+esc(b.time):''}</b>${b.client.guests?' · Гостей: <b>'+esc(b.client.guests)+'</b>':''}</div>
    ${b.client.name?`<div>Клиент: ${esc(b.client.name)} ${esc(b.client.surname||'')}${b.client.phone?', '+esc(b.client.phone):''}</div>`:''}
    ${b.comment?`<div>Комментарий: ${esc(b.comment)}</div>`:''}
    <table><thead><tr><th>Позиция</th><th class="num">Кол-во</th>${mode==='client'?'<th class="num">Цена</th><th class="num">Сумма</th>':''}</tr></thead>
    <tbody>${rows}</tbody>
    ${mode==='client'?`<tfoot>
      ${t.service?`<tr><td colspan="3">Надбавка за обслуживание ${b.servicePct}%</td><td class="num">${fmt0(t.service)}</td></tr>`:''}
      ${t.discount?`<tr><td colspan="3">Скидка</td><td class="num">−${fmt0(t.discount)}</td></tr>`:''}
      <tr class="tot"><td colspan="3">Итого</td><td class="num">${fmt0(t.total)}</td></tr>
      <tr><td colspan="3">Оплачено</td><td class="num">${fmt0(t.paid)}</td></tr>
      <tr class="tot"><td colspan="3">Остаток</td><td class="num">${fmt0(Math.max(0,t.rest))}</td></tr>
    </tfoot>`:''}</table>`;
  window.print();
}
function printDay(){
  const d=todayISO();
  const rows=S.banquets.filter(x=>x.data.date===d&&x.data.status!=='cancelled');
  $('#printArea').innerHTML=`<h1>Банкеты на ${ruDate(d)}</h1>
  <table><thead><tr><th>№</th><th>Время</th><th>Фронт</th><th>Клиент</th><th class="num">Гостей</th><th class="num">Сумма</th><th class="num">Оплачено</th></tr></thead>
  <tbody>${rows.map(x=>{const b=x.data,t=bqTotals(b);
    return `<tr><td>${esc(b.num||'')}</td><td>${esc(b.time||'')}</td><td>${esc((bqFront(b)||{}).name||'')}</td>
    <td>${esc(b.client.name||'')}</td><td class="num">${esc(b.client.guests||'')}</td>
    <td class="num">${fmt0(t.total)}</td><td class="num">${fmt0(t.paid)}</td></tr>`;}).join('')}</tbody></table>`;
  window.print();
}

/* ================= НАСТРОЙКИ (меню и структура) ================= */
async function renderSettings(scr,bar){
  if(!S.rms.length){scr.innerHTML='<div class="setwrap">Структура не загружена.</div>';return;}
  if(!S.menuRms)S.menuRms=S.rms[0].id;
  const menu=await loadMenu(S.menuRms);
  const cats=[...new Set(menu.items.map(i=>i.category||'Прочее'))];
  scr.innerHTML=`<div class="setwrap">
    <h3>Фронты (концепция и склад — из справочников iiko)</h3>
    <datalist id="dl_conc">${S.conceptions.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <datalist id="dl_store">${S.stores.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <table><thead><tr><th>Фронт</th><th>РМС</th><th>Концепция</th><th>Склад</th><th></th></tr></thead><tbody>
    ${S.fronts.map(f=>`<tr>
      <td><input data-fn="${f.id}" value="${esc(f.name)}"></td>
      <td><select data-fr="${f.id}">${S.rms.map(r=>`<option value="${r.id}" ${r.id===f.rmsId?'selected':''}>${esc(r.name)}</option>`).join('')}</select></td>
      <td><input data-fc="${f.id}" value="${esc(f.conception||'')}" list="dl_conc"></td>
      <td><input data-fs="${f.id}" value="${esc(f.store||'')}" list="dl_store"></td>
      <td style="width:40px"><button data-fd="${f.id}" style="border:none;background:none;cursor:pointer">✕</button></td></tr>`).join('')}
    </tbody></table>
    <p><button class="wtile" id="addFront" style="padding:10px 20px">+ Добавить фронт</button></p>
    <h3>Программа</h3>
    <p class="muted" id="verinfo">Версия: …</p>
    <p><button class="wtile" id="btn_update" style="padding:10px 20px">Обновить программу</button>
       <button class="wtile" id="btn_sync" style="padding:10px 20px;margin-left:8px">Обновить меню и сотрудников из iiko</button>
       <span id="upd_msg" class="muted" style="margin-left:10px"></span></p>
    <h3>PIN-коды сотрудников (вход во фронт)</h3>
    <p class="muted">Сотрудники подтянуты из iiko. Если PIN не подошёл или нужен свой — найдите сотрудника и задайте код (4 цифры).</p>
    <p><input id="emp_q" placeholder="Начните вводить фамилию…" style="max-width:340px"></p>
    <div id="emp_list"></div>
    <h3>Меню — <select id="mp" style="width:auto">${S.rms.map(r=>`<option value="${r.id}" ${r.id===S.menuRms?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
      <span class="muted">${menu.items.length} позиций — меню и цены берутся из действующего прайс-листа iiko автоматически, ручные правки перезапишутся при синхронизации</span></h3>
    <p style="display:flex;gap:8px"><input id="mi_name" placeholder="Название (точно как в iiko!)" style="flex:2">
      <input id="mi_cat" placeholder="Категория" list="catlist" style="flex:1"><datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
      <input id="mi_price" placeholder="Цена" style="width:100px"><button class="wtile" id="mi_add" style="padding:8px 18px">Добавить</button></p>
    ${cats.map(c=>`<h3>${esc(c)}</h3><table><tbody>
      ${menu.items.filter(i=>(i.category||'Прочее')===c).map(i=>`<tr><td>${esc(i.name)}</td>
      <td style="width:120px"><input data-mp="${i.id}" value="${i.price}"></td>
      <td style="width:40px"><button data-md="${i.id}" style="border:none;background:none;cursor:pointer">✕</button></td></tr>`).join('')}
    </tbody></table>`).join('')}
  </div>`;
  try{const st=await fetch('/api/status').then(x=>x.json());
    $('#verinfo').textContent='Версия: '+(st.version||'—')+(st.last_sync_result?' · '+st.last_sync_result:'');}catch(e){$('#verinfo').textContent='Версия: (запущено без сервера)';}
  const act=(url,msg)=>async()=>{$('#upd_msg').textContent=msg;
    try{const r=await fetch(url,{method:'POST'}).then(x=>x.json());$('#upd_msg').textContent=r.result||r.error||'готово';}
    catch(e){$('#upd_msg').textContent='Ошибка: '+e;}};
  $('#btn_update').onclick=act('/api/update','Проверяю обновления…');
  $('#btn_sync').onclick=act('/api/sync','Синхронизирую с iiko…');
  const ovDoc=await dbGetDoc('config/pin_overrides')||{items:{}};
  function drawEmp(){
    const q=($('#emp_q').value||'').toLowerCase().trim();
    const rows=q?S.employees.filter(e=>e.name.toLowerCase().includes(q)).slice(0,15):[];
    $('#emp_list').innerHTML=rows.length?'<table><tbody>'+rows.map(e=>`<tr><td>${esc(e.name)}</td>
      <td style="width:130px"><input data-ep="${e.id}" value="${esc((ovDoc.items||{})[e.id]||e.pin||'')}" inputmode="numeric" maxlength="6" placeholder="PIN"></td></tr>`).join('')+'</tbody></table>'
      :(q?'<p class="muted">Не найдено.</p>':'');
    $('#emp_list').querySelectorAll('[data-ep]').forEach(i=>i.onchange=()=>{
      ovDoc.items=ovDoc.items||{};ovDoc.items[i.dataset.ep]=i.value.trim();
      dbSetDoc('config/pin_overrides',ovDoc);
      const emp=S.employees.find(e=>e.id===i.dataset.ep);if(emp)emp.pin=i.value.trim();
    });
  }
  $('#emp_q').oninput=drawEmp;drawEmp();
  const chk=(v,l,w)=>{if(v&&!l.includes(v))alert('Внимание: «'+v+'» нет в справочнике '+w+' iiko — акт реализации не пройдёт.');};
  scr.querySelectorAll('[data-fn]').forEach(i=>i.onchange=()=>{frontById(i.dataset.fn).name=i.value.trim();saveStructure();});
  scr.querySelectorAll('[data-fr]').forEach(s=>s.onchange=()=>{frontById(s.dataset.fr).rmsId=s.value;saveStructure();});
  scr.querySelectorAll('[data-fc]').forEach(i=>i.onchange=()=>{chk(i.value.trim(),S.conceptions,'концепций');frontById(i.dataset.fc).conception=i.value.trim();saveStructure();});
  scr.querySelectorAll('[data-fs]').forEach(i=>i.onchange=()=>{chk(i.value.trim(),S.stores,'складов');frontById(i.dataset.fs).store=i.value.trim();saveStructure();});
  scr.querySelectorAll('[data-fd]').forEach(x=>x.onclick=()=>iConfirm('Удалить фронт?',()=>{S.fronts=S.fronts.filter(f=>f.id!==x.dataset.fd);saveStructure();render();}));
  $('#addFront').onclick=()=>{S.fronts.push({id:uid(),name:'Новый фронт',rmsId:S.rms[0].id,conception:'',store:''});saveStructure();render();};
  $('#mp').onchange=e=>{S.menuRms=e.target.value;render();};
  const saveMenu=()=>dbSetDoc('menus/'+S.menuRms,menu);
  $('#mi_add').onclick=()=>{const n=$('#mi_name').value.trim();if(!n)return;
    menu.items.push({id:uid(),name:n,category:$('#mi_cat').value.trim()||'Прочее',price:num($('#mi_price').value)});saveMenu();render();};
  scr.querySelectorAll('[data-mp]').forEach(i=>i.onchange=()=>{menu.items.find(x=>x.id===i.dataset.mp).price=num(i.value);saveMenu();});
  scr.querySelectorAll('[data-md]').forEach(x=>x.onclick=()=>{menu.items=menu.items.filter(i=>i.id!==x.dataset.md);saveMenu();render();});
  botbar(bar,[{a:'back',t:'Назад',ic:'‹'}]);
  bar._acts={back:()=>go('home')};
}
</script>
